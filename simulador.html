<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste de cadastro · Seu Moura</title><link rel="stylesheet" href="./styles.css"><style>body{background:#f6f2e9;color:#191919;font-family:system-ui,sans-serif}main{max-width:720px;margin:4rem auto;padding:2rem}textarea{width:100%;min-height:150px;padding:1rem;font:inherit}input,button{font:inherit;margin:.8rem 0}pre{white-space:pre-wrap;background:white;padding:1.5rem;border-radius:12px}a{color:inherit}</style></head><body><main><h1>Teste do cadastro por WhatsApp</h1><p>Simule a conversa antes de conectar um número real. Comece enviando <strong>NOVO</strong>, depois os dados e as fotos. Este simulador só abre no seu computador com <code>DEMO_MODE=1</code>.</p><form id="demo"><label for="message">Mensagem</label><textarea id="message" placeholder="NOVO" required></textarea><label for="photo">Foto opcional</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><button type="submit">Enviar mensagem</button></form><h2>Resposta</h2><pre id="reply" role="status">Envie NOVO para começar.</pre><a href="./imoveis.html">Ver catálogo</a></main><script>document.querySelector('#demo').addEventListener('submit',async event=>{event.preventDefault();const photo=document.querySelector('#photo').files[0],text=document.querySelector('#message').value;let image=null;if(photo){image=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(photo);});}const reply=document.querySelector('#reply');try{const response=await fetch('./api/demo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,photo:image})});const data=await response.json();reply.textContent=data.reply||data.error||'Falha';if(response.ok){document.querySelector('#message').value='';document.querySelector('#photo').value='';}}catch(error){reply.textContent=error.message;}});</script></body></html>
