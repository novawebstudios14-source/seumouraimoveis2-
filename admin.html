<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gestão de imóveis · Seu Moura</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#263432;background:#f3f2ed}*{box-sizing:border-box}body{margin:0}header{background:#173e39;color:white;padding:20px max(24px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center}header a{color:#f6dfa9;text-decoration:none}main{max-width:1100px;margin:32px auto;padding:0 22px}h1{font-size:clamp(28px,4vw,42px)}h2{font-size:23px}.panel{background:white;border-radius:18px;padding:26px;box-shadow:0 8px 32px #173e3912;margin:20px 0}label{display:block;font-size:14px;font-weight:650;margin:16px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #abb9b4;border-radius:8px;font:inherit;background:white}textarea{min-height:110px}input:focus,select:focus,textarea:focus{outline:2px solid #347a66}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}button{border:0;border-radius:9px;padding:12px 18px;background:#176c57;color:white;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#e6ece8;color:#173e39}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.muted{color:#65746e}.error{color:#9a3131}.ok{color:#176c57}.hidden{display:none!important}#login{max-width:440px;margin:60px auto}.item{border-top:1px solid #e4e9e5;padding:14px 0;display:flex;justify-content:space-between;gap:16px;align-items:center}.item small{display:block;margin-top:5px}.photo-preview{display:flex;gap:8px;flex-wrap:wrap}.photo-preview img{height:92px;width:120px;object-fit:cover;border-radius:8px}@media(max-width:620px){.cols{grid-template-columns:1fr}.item{display:block}}
</style><script src="./admin.js" defer></script></head><body><header><strong>Seu Moura · Imóveis</strong><a href="./imoveis.html">Ver catálogo ↗</a></header><main><section id="login" class="panel hidden"><h1>Entrar</h1><p class="muted">Acesso para cadastrar imóveis.</p><form id="login-form"><label for="user">Usuário</label><input id="user" autocomplete="username" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button>Receber códigos</button></div></form><form id="verify-form" class="hidden"><p>Digite os códigos enviados ao e-mail e celular.</p><label for="email-code">Código do e-mail</label><input id="email-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><label for="phone-code">Código do SMS</label><input id="phone-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><div class="actions"><button>Confirmar e entrar</button></div></form></section><div id="workspace" class="hidden"><div class="actions" style="justify-content:space-between;align-items:center"><h1>Cadastro de imóveis</h1><button class="secondary" id="logout">Sair</button></div><section class="panel"><h2 id="form-heading">Novo imóvel</h2><p class="muted">Preencha os dados, selecione as fotos e publique. Campos com * são obrigatórios.</p><form id="property-form"><div class="cols"><div><label for="titulo">Título *</label><input name="titulo" id="titulo" maxlength="160" required></div><div><label for="finalidade">Finalidade *</label><select name="finalidade" id="finalidade"><option value="venda">Venda</option><option value="aluguel">Aluguel</option></select></div><div><label for="tipo">Tipo *</label><input name="tipo" id="tipo" maxlength="160" required placeholder="Casa, apartamento, terreno..."></div><div><label for="bairro">Bairro *</label><input name="bairro" id="bairro" maxlength="160" required></div><div><label for="cidade">Cidade</label><input name="cidade" id="cidade" value="Marabá" maxlength="160"></div><div><label for="preco">Preço em reais *</label><input name="preco" id="preco" type="number" min="1" step="0.01" required></div><div><label for="quartos">Quartos</label><input name="quartos" id="quartos" type="number" min="0" step="1"></div><div><label for="banheiros">Banheiros</label><input name="banheiros" id="banheiros" type="number" min="0" step="1"></div><div><label for="area">Área (m²)</label><input name="area" id="area" type="number" min="0" step="0.01"></div><div><label for="photos">Fotos (até 20; JPG, PNG ou WebP)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></div></div><label for="descricao">Descrição</label><textarea name="descricao" id="descricao" maxlength="1000"></textarea><div class="photo-preview" id="preview"></div><div class="actions"><button id="save">Publicar imóvel</button><button class="secondary hidden" type="button" id="cancel">Cancelar edição</button></div></form></section><section class="panel"><h2>Imóveis cadastrados</h2><div id="list"></div></section></div><p id="notice" role="status"></p></main></body></html>
